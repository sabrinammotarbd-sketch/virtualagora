name: Windows Cloud PC – Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 10080 # Máximo de 7 dias para execução

    steps:
      - name: Downloading & Installing AnyDesk
        run: |
          choco install anydesk -y --no-progress

      - name: Log In To AnyDesk
        run: |
          # Define uma senha padrão para o AnyDesk (substitua 'SuaSenha123' se quiser)
          echo "SuaSenha123" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
          
          # Obtém a ID de acesso do AnyDesk
          $anydeskId = & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
          Write-Host "======================================"
          Write-Host "SUA ID DO ANYDESK É: $anydeskId"
          Write-Host "SUA SENHA É: SuaSenha123"
          Write-Host "======================================"

      - name: Monitor and Keep Alive
        run: |
          while ($true) {
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not $process) {
                  Write-Host "Iniciando AnyDesk..."
                  Start-Process -FilePath "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
              }
              Start-Sleep -Seconds 300
          }

      - name: Time Counter (Long Running Task)
        run: |
          Start-Sleep -Seconds 604800
