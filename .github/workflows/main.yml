name: Windows Cloud PC – Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Instalar AnyDesk
        run: |
          choco install anydesk -y --no-progress

      - name: Configurar e Gerar ID
        run: |
          # Inicia o serviço do AnyDesk em segundo plano
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --install "C:\ProgramData\AnyDesk" --start-with-win --silent
          Start-Sleep -Seconds 10
          
          # Define a senha de acesso
          echo "SuaSenha123" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
          Start-Sleep -Seconds 5
          
          # Pega a ID gerada no arquivo de sistema
          $config = Get-Content "C:\ProgramData\AnyDesk\system.conf" -ErrorAction SilentlyContinue | Select-String "ad.anydesk.id="
          if ($config) {
              $id = $config.ToString().Split('=')[1]
              Write-Host "======================================"
              Write-Host "SUA ID DO ANYDESK E: $id"
              Write-Host "SENHA: SuaSenha123"
              Write-Host "======================================"
          } else {
              Write-Host "Iniciando AnyDesk..."
              & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
          }

      - name: Manter Conexao Ativa
        run: |
          while ($true) {
              Start-Sleep -Seconds 300
          }
