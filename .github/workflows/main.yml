name: Windows Cloud PC - AnyDesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set up job
        run: echo "Iniciando a configuração do Cloud PC..."

      - name: Instalar AnyDesk
        run: |
          winget install --id AnyDesk.AnyDesk --accept-source-agreements --accept-package-agreements --ignore-security-hash

      - name: Configurar e Gerar ID
        run: |
          # Adiciona aqui os teus comandos de configuração do AnyDesk ou inicialização do serviço, se necessário
          Write-Host "AnyDesk instalado com sucesso. A configurar ID..."
          # Exemplo para garantir que o serviço está a correr:
          Start-Service AnyDesk -ErrorAction SilentlyContinue
