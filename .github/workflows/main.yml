name: Windows Cloud PC - Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Instalar AnyDesk
        run: |
          winget install --id AnyDesk.AnyDesk --accept-source-agreements --accept-package-agreements

      - name: Configurar e Gerar ID
        run: |
          # Inicia o serviço do AnyDesk em segundo plano
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --start-service
          Start-Sleep -Seconds 10

          # Define a senha de acesso
          echo "SuaSenha123" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
          Start-Sleep -Seconds 5

          # Pega a ID gerada e converte para texto puro
          $config = Get-Content "C:\ProgramData\AnyDesk\system.conf" -Raw
          if ($config -match 'ad.anydesk.id=([0-9]+)') {
              $id = $Matches[1]
              Write-Host "===================="
              Write-Host "AnyDesk ID: $id"
              Write-Host "===================="
          } else {
              $id = (Get-Content "C:\ProgramData\AnyDesk\system.conf" | Select-String -Pattern 'ad.anydesk.id').Line
              Write-Host "===================="
              Write-Host "AnyDesk ID: $id"
              Write-Host "===================="
          }
