name: Windows Cloud PC – Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Instalar AnyDesk
        run: |
          choco install anydesk -y --no-progress

      - name: Configurar Senha e Iniciar
        run: |
          # Define a senha padrao
          echo "SuaSenha123" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
          
          # Inicia o servico do AnyDesk
          Start-Service anydesk -ErrorAction SilentlyContinue
          Start-Process -FilePath "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          
          # Aguarda 15 segundos para registrar na rede
          Start-Sleep -Seconds 15

      - name: Mostrar ID de Acesso
        run: |
          $id = & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
          Write-Host "======================================"
          Write-Host "SUA ID DO ANYDESK E: $id"
          Write-Host "SENHA: SuaSenha123"
          Write-Host "======================================"

      - name: Manter Ativo
        run: |
          while ($true) {
              Start-Sleep -Seconds 300
          }
