name: Windows Cloud PC – Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Downloading & Installing AnyDesk
        run: |
          choco install anydesk -y --no-progress

      - name: Log In To AnyDesk
        run: |
          # Define a senha de acesso remoto
          echo "SuaSenha123" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
          
          # Aguarda a criação do arquivo de configuração
          Start-Sleep -Seconds 10
          
          # Extrai a ID diretamente do arquivo de sistema do AnyDesk
          $configPath = "C:\ProgramData\AnyDesk\system.conf"
          if (Test-Path $configPath) {
              $idLine = Get-Content $configPath | Select-String "ad.anydesk.id="
              $anydeskId = $idLine.ToString().Split('=')[1]
              Write-Host "======================================"
              Write-Host "SUA ID DO ANYDESK É: $anydeskId"
              Write-Host "SUA SENHA É: SuaSenha123"
              Write-Host "======================================"
          } else {
              Write-Host "Aguardando serviço gerar ID..."
          }

      - name: Monitor and Keep Alive
        run: |
          while ($true) {
              Start-Sleep -Seconds 300
          }
