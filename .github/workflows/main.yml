name: Windows Cloud PC - Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Instalar AnyDesk
        run: |
          winget install --id AnyDesk.AnyDesk --accept-source-agreements --accept-package-agreements

      - name: Configurar e Gerar ID
        run: |
          # Inicia o serviço do AnyDesk em segundo plano
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --start-service
          Start-Sleep -Seconds 10

          # Define a senha de acesso
          echo "SuaSenha123" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
          Start-Sleep -Seconds 5

          # Procura pelo ID em todos os arquivos de configuração possíveis ou exibe a pasta
          $idFile = Get-ChildItem -Path "C:\ProgramData\AnyDesk" -Filter "*.conf" -Recurse -ErrorAction SilentlyContinue
          if ($idFile) {
              foreach ($file in $idFile) {
                  $content = Get-Content $file.FullName -Raw
                  if ($content -match 'ad\.anydesk\.id\s*=\s*([0-9]+)') {
                      Write-Host "===================="
                      Write-Host "AnyDesk ID Encontrado: $($Matches[1])"
                      Write-Host "===================="
                      exit 0
                  }
              }
          }

          # Se não achar pelo filtro, lista o conteúdo da pasta para diagnosticarmos
          Write-Host "ID não encontrado automaticamente. Listando arquivos na pasta do AnyDesk:"
          Get-ChildItem -Path "C:\ProgramData\AnyDesk" -Recurse
