name: Windows Cloud PC - AnyDesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set up job
        run: echo "Iniciando a configuração do Cloud PC..."

      - name: Instalar AnyDesk (Download Direto)
        run: |
          $installerPath = "$env:TEMP\AnyDesk.exe"
          Write-Host "A descarregar o AnyDesk..."
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile $installerPath
          
          Write-Host "A instalar o AnyDesk..."
          Start-Process -FilePath $installerPath -ArgumentList "--install", "--silent", "--accept-hw-id" -Wait
          
          Remove-Item $installerPath -ErrorAction SilentlyContinue
          Write-Host "Instalação concluída com sucesso!"

      - name: Configurar Senha e Obter ID
        run: |
          Write-Host "A procurar o executável do AnyDesk..."
          
          $anydeskPath = "$env:APPDATA\AnyDesk\AnyDesk.exe"
          if (-Not (Test-Path $anydeskPath)) {
              $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          }
          if (-Not (Test-Path $anydeskPath)) {
              $anydeskPath = "C:\Program Files\AnyDesk\AnyDesk.exe"
          }
          
          Write-Host "Caminho encontrado: $anydeskPath"
          
          $password = "SuaSenhaForte123"
          
          # Forma corrigida para passar a senha via pipeline no PowerShell para o AnyDesk
          $password | & $anydeskPath --set-password
          
          Write-Host "Senha configurada com sucesso!"
          
          # Obtém e mostra o ID do AnyDesk nos logs
          $anydeskId = & $anydeskPath --get-id
          Write-Host "===================================="
          Write-Host "SEU ID DO ANYDESK É: $anydeskId"
          Write-Host "===================================="

      - name: Manter o PC Ligado
        run: |
          Write-Host "Cloud PC ligado e pronto a ser acedido!"
          Start-Sleep -Seconds 21600
